plugins {
    id 'com.android.application'
}

android {
    namespace 'com.efraim.imagereaderai'
    compileSdk 34

    defaultConfig {
        applicationId "com.efraim.imagereaderai"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        // URL do webhook n8n. Trocar pelo IP da sua máquina na LAN.
        // No emulador, use http://10.0.2.2:5678 (aponta para o host).
        buildConfigField "String", "WEBHOOK_URL", "\"http://10.0.2.2:5678/webhook/imagereader\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // CameraX — captura de foto
    def camerax = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"

    // Rede — envio ao webhook n8n
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
